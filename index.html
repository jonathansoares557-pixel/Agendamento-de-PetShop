<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo Pet · Agendamento de PetShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page">
    <!-- Topbar -->
    <header class="topbar">
      <span class="project-label">Projeto</span>
      <div class="brand-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 12.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm5.5-5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm4 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm5.5 5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5ZM12 21c-2.9 0-6-1.6-6-4.4 0-2.3 2.1-3.4 2.9-4.6.8-1.2 1.4-2.5 3.1-2.5s2.3 1.3 3.1 2.5c.8 1.2 2.9 2.3 2.9 4.6 0 2.8-3.1 4.4-6 4.4Z"/></svg>
        <span>MUNDO PET</span>
      </div>
    </header>

    <!-- Agenda card -->
    <main class="agenda-card">
      <div class="agenda-header">
        <div class="agenda-heading">
          <h1>Sua agenda</h1>
          <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
        </div>

        <label class="date-picker" id="datePickerBtn" for="dateInput">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span id="selectedDateLabel">10/01/2024</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <input type="date" id="dateInput" aria-label="Selecionar data">
        </label>
      </div>

      <div id="periodsContainer" class="periods"></div>
    </main>
  </div>

  <button class="fab" id="openModalBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    NOVO AGENDAMENTO
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="closeModalBtn" aria-label="Fechar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>

      <h2 id="modalTitle">Agende um atendimento</h2>
      <p class="modal-subtitle" id="modalSubtitle">Preencha os dados do cliente para realizar o agendamento:</p>

      <form id="appointmentForm" novalidate>
        <div class="field">
          <label for="tutor">Nome do tutor</label>
          <div class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="tutor" name="tutor" type="text" placeholder="Helena Souza" required>
          </div>
        </div>

        <div class="field">
          <label for="pet">Nome do pet</label>
          <div class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 12.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm5.5-5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm4 0a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Zm5.5 5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5ZM12 21c-2.9 0-6-1.6-6-4.4 0-2.3 2.1-3.4 2.9-4.6.8-1.2 1.4-2.5 3.1-2.5s2.3 1.3 3.1 2.5c.8 1.2 2.9 2.3 2.9 4.6 0 2.8-3.1 4.4-6 4.4Z"/></svg>
            <input id="pet" name="pet" type="text" placeholder="Cheddar" required>
          </div>
        </div>

        <div class="field">
          <label for="phone">Telefone</label>
          <div class="input-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92Z"/></svg>
            <input id="phone" name="phone" type="tel" placeholder="(00) 0 0000-0000" required>
          </div>
        </div>

        <div class="field">
          <label for="service">Descrição do serviço</label>
          <textarea id="service" name="service" rows="3" placeholder="Banho e tosa" required></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="date">Data</label>
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <input id="date" name="date" type="date" required>
            </div>
          </div>
          <div class="field">
            <label for="time">Hora</label>
            <div class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              <input id="time" name="time" type="time" required>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">AGENDAR</button>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
